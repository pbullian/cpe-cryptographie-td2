services:
  toolbox:
    build: ./toolbox
    working_dir: /work
    volumes:
      - ./files:/files:ro
      - ./work:/work
  amadrone:
    image: nginx:alpine
    volumes:
      - ./sites/amadrone:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
  spacey:
    image: nginx:alpine
    volumes:
      - ./sites/spacey:/usr/share/nginx/html:ro
    ports:
      - "8082:80"
  looker:
    image: nginx:alpine
    volumes:
      - ./sites/looker:/usr/share/nginx/html:ro
    ports:
      - "8083:80"
