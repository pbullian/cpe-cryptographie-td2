services:
  toolbox:
    build: ./toolbox
    working_dir: /work
    volumes:
      - ./files:/files:ro
      - ./work:/work
  chiffreur:          # S2
    build: ./chiffreur
    ports:
      - "8000:8000"
  amadrone:           # S4
    image: nginx:alpine
    volumes:
      - ./sites/amadrone:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
  spacey:             # S4
    image: nginx:alpine
    volumes:
      - ./sites/spacey:/usr/share/nginx/html:ro
    ports:
      - "8082:80"
  looker:             # S4
    image: nginx:alpine
    volumes:
      - ./sites/looker:/usr/share/nginx/html:ro
    ports:
      - "8083:80"
